<script>
/* Modalità file locale: l'AI usa la tua chiave API (GroqCloud o Anthropic), salvata solo in questo browser. */
if(typeof claude==="undefined"){(function(){
const KEY="akey",DEF={groq:"openai/gpt-oss-120b",ant:"claude-sonnet-5-5"};
const PREF=["openai/gpt-oss-120b","llama-3.3-70b-versatile","openai/gpt-oss-20b","llama-3.1-8b-instant"];
const NOCHAT=/whisper|guard|tts|orpheus|playai|embed|safeguard|compound/i;
const prov=k=>String(k).startsWith("sk-ant")?"ant":"groq";
const model=p=>localStorage.getItem("amodel_"+p)||DEF[p];
const SYS="Rispondi sempre e solo con JSON valido, senza testo prima o dopo e senza blocchi di codice.";
async function groqModels(key){
 try{const r=await fetch("https://api.groq.com/openai/v1/models",{headers:{authorization:"Bearer "+key}});const d=await r.json();
  return (d.data||[]).map(m=>m.id).filter(id=>id&&!NOCHAT.test(id))}catch(e){return[]}
}
async function pick(key){
 const ids=await groqModels(key);if(!ids.length)return null;
 return PREF.find(m=>ids.includes(m))||ids[0];
}
async function ask(prompt,retry){
 const key=localStorage.getItem(KEY);
 if(!key)throw new Error("Per usare l’AI serve la tua chiave API: tocca “🔑 Chiave AI” in alto.");
 const p=prov(key),m=model(p);let r;
 try{
  if(p==="ant")r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:m,max_tokens:8000,system:SYS,messages:[{role:"user",content:prompt}]})});
  else{
   const body={model:m,temperature:0.4,max_tokens:8000,messages:[{role:"system",content:SYS},{role:"user",content:prompt}]};
   if(/gpt-oss/i.test(m))body.reasoning_effort="low";
   r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+key},body:JSON.stringify(body)});
  }
 }catch(e){throw new Error("Connessione non riuscita: controlla internet.")}
 const d=await r.json().catch(()=>({}));
 if(!r.ok){
  const msg=(d.error&&d.error.message)||"";
  if(p==="groq"&&!retry&&(r.status===404||(/model/i.test(msg)&&/exist|access|decommission|not found|deprecat/i.test(msg)))){
   const nm=await pick(key);
   if(nm&&nm!==m){localStorage.setItem("amodel_groq",nm);return ask(prompt,1)}
  }
  if(r.status===401)throw new Error("Chiave API non valida: controllala con “🔑 Chiave AI”.");
  if(r.status===429)throw new Error("Limite di richieste raggiunto: attendi un minuto e riprova.");
  throw new Error(msg||"Errore AI ("+r.status+"). Prova a cambiare modello con ⚙️.");
 }
 let t=p==="ant"?(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join(""):(((d.choices||[])[0]||{}).message||{}).content||"";
 t=t.replace(/<think>[\s\S]*?<\/think>/g,"");
 const a=t.search(/[\[{]/),z=Math.max(t.lastIndexOf("]"),t.lastIndexOf("}"));
 try{return JSON.parse(t.slice(a,z+1))}catch(e){throw new Error("Risposta AI non leggibile, riprova.")}
}
window.claude={use:async n=>n==="sample"?{json:ask}:null};
function upd(){const b=document.getElementById("kb");if(b){const k=localStorage.getItem(KEY);b.textContent=k?"🔑 Chiave AI ✓ ("+(prov(k)==="ant"?"Claude":"Groq")+")":"🔑 Chiave AI"}}
window.setKey=()=>{const k=prompt("Incolla la tua chiave API: GroqCloud (inizia con gsk_) oppure Anthropic (sk-ant-). Resta salvata solo in questo browser. Lascia vuoto per rimuoverla.",localStorage.getItem(KEY)||"");if(k===null)return;k.trim()?localStorage.setItem(KEY,k.trim()):localStorage.removeItem(KEY);upd()};
window.setModel=async()=>{
 const key=localStorage.getItem(KEY)||"",p=prov(key);let extra="";
 if(key&&p==="groq"){const ids=await groqModels(key);if(ids.length)extra="\n\nModelli disponibili con la tua chiave:\n"+ids.join("\n")}
 const m=prompt("Nome del modello da usare ("+(p==="ant"?"Claude":"GroqCloud")+"). Lascia vuoto per il predefinito ("+DEF[p]+")."+extra,model(p));
 if(m===null)return;m.trim()?localStorage.setItem("amodel_"+p,m.trim()):localStorage.removeItem("amodel_"+p)};
document.querySelector("h1").insertAdjacentHTML("afterend",'<div style="display:flex;gap:6px;flex-wrap:wrap"><button id="kb" class="btn g" style="padding:5px 12px;font-size:13px" onclick="setKey()"></button><button class="btn g" style="padding:5px 12px;font-size:13px" onclick="setModel()" aria-label="Cambia modello">⚙️ Modello</button></div>');upd();
})()}
</script>
<script>
const CATS=["Cereali e derivati","Latticini e uova","Carne e pesce","Frutta e verdura","Legumi","Condimenti e oli","Dolci e snack","Bevande","Altro"];
const KW={"Cereali e derivati":"pasta riso farina pane couscous orzo farro avena cereali fette polenta","Latticini e uova":"latte yogurt burro panna uova uovo formaggio mozzarella ricotta parmigiano","Carne e pesce":"pollo manzo maiale tonno salmone prosciutto salame pesce carne","Frutta e verdura":"mela banana pomodor insalata zucchin carot patat cipolla limon arancia spinaci verdur frutta","Legumi":"ceci fagioli lenticchie piselli fave","Condimenti e oli":"olio aceto sale pepe salsa passata spezie","Dolci e snack":"biscott cioccolat zucchero marmellata nutella merendin","Bevande":"acqua succo birra vino caffè tè bibita"};
const FRESH=/latte|panna|yogurt|ricotta|mozzarella|burro|succo/i;
const U={kg:["g",1000],g:["g",1],l:["ml",1000],ml:["ml",1],pz:["pz",1]};
const L=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let S={tab:"oggi",items:L("items")||[],lib:L("lib")||{},hist:L("hist")||[],ph:L("ph")||{},mine:L("mine")||[],shop:L("shop")||[],srch:[],impLink:"",q:"",sb:false,serr:"",recs:[],cur:null,step:0,done:{},busy:false,err:""};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.toISOString().slice(0,10);
const today=()=>iso(new Date());
const days=d=>d?Math.round((new Date(d)-new Date(today()))/864e5):Infinity;
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const save=()=>{if(S.hist.length>60)S.hist.length=60;W("items",S.items);W("lib",S.lib);W("hist",S.hist);W("mine",S.mine);W("shop",S.shop);if(!ghMute){try{localStorage.setItem("lm",Date.now())}catch(e){}if(ghOn())ghSched()}push()};
const fmt=(q,u)=>u==="pz"?q+" pz":q>=1000?(q/1000).toFixed(q%1000?2:0).replace(/\.?0+$/,"")+(u==="g"?" kg":" l"):Math.round(q)+" "+u;
const guess=n=>{n=n.toLowerCase();for(const c in KW)if(KW[c].split(" ").some(k=>n.includes(k)))return c;return "Altro"};
const soon=()=>S.items.filter(i=>days(i.exp)<=3);
function toast(m){$("t").innerHTML=`<div class="toast">${m}</div>`;setTimeout(()=>$("t").innerHTML="",8000)}
function render(){if(S.tab!=="nuova")S.edId=null;
 const tabs=[["oggi","🏠 Oggi"],["dispensa","Dispensa"],["add","Aggiungi spesa"],["ricette","Ricette AI"],["cerca","Cerca online"],["nuova","Nuova ricetta"],["ricettario","Ricettario"],["lista","Lista spesa"+(S.shop.filter(x=>!x.done).length?" ("+S.shop.filter(x=>!x.done).length+")":"")],["pref","Preferiti"],["cron","Cronologia"]];
 $("nav").innerHTML=tabs.map(([k,n])=>`<button class="${S.tab===k?"on":""}" onclick="S.tab='${k}';render()">${n}</button>`).join("");
 $("v").innerHTML=({oggi:vOggi,dispensa:vDisp,add:vAdd,ricette:vRic,cerca:vSearch,nuova:vNew,ricettario:vBook,lista:vShop,pref:vPref,cron:vHist})[S.tab]()+(S.tab==="dispensa"?vBackup()+(window.setKey?ghCard():""):"");
}
const EM=[["uov","🥚"],["pasta","🍝"],["spaghet","🍝"],["riso","🍚"],["farina","🌾"],["pane","🍞"],["latte","🥛"],["yogurt","🥛"],["panna","🥛"],["formagg","🧀"],["parmigiano","🧀"],["mozzarella","🧀"],["ricotta","🧀"],["burro","🧈"],["pollo","🍗"],["manzo","🥩"],["maiale","🥩"],["carne","🥩"],["prosciutto","🥓"],["salame","🥓"],["tonno","🐟"],["salmone","🐟"],["pesce","🐟"],["pomodor","🍅"],["passata","🍅"],["insalata","🥬"],["spinaci","🥬"],["zucchin","🥒"],["carot","🥕"],["patat","🥔"],["cipolla","🧅"],["aglio","🧄"],["limon","🍋"],["melanzan","🍆"],["mela","🍎"],["banana","🍌"],["arancia","🍊"],["fragol","🍓"],["uva","🍇"],["peperon","🫑"],["funghi","🍄"],["fagioli","🫘"],["ceci","🫘"],["lenticch","🫘"],["piselli","🌱"],["olio","🫒"],["sale","🧂"],["zucchero","🍬"],["miele","🍯"],["cioccolat","🍫"],["biscott","🍪"],["acqua","💧"],["succo","🧃"],["vino","🍷"],["birra","🍺"],["caffè","☕"]];
const CE={"Cereali e derivati":"🌾","Latticini e uova":"🥛","Carne e pesce":"🥩","Frutta e verdura":"🥦","Legumi":"🫘","Condimenti e oli":"🫒","Dolci e snack":"🍪","Bevande":"🥤","Altro":"🛒"};
const emo=(n,c)=>{n=(n||"").toLowerCase();const m=EM.find(([k])=>n.includes(k));return m?m[1]:CE[c||guess(n)]||"🛒"};
const SRC={ai:["🤖","Consigliata dall’AI"],web:["🔎","Cercata online con l’AI"],manual:["✍️","Inserita manualmente"],link:["🔗","Importata da link"]};
const srcB=r=>{const s=SRC[r.src||"ai"]||SRC.ai;return `<span class="bd ok">${s[0]} ${s[1]}</span>`};
const nm=s=>String(s||"").toLowerCase().trim();
const matchIt=g=>{if(g.id)return S.items.find(i=>i.id===g.id);const n=nm(g.name);if(n.length<3)return;return S.items.find(i=>i.u===g.unit&&nm(i.name).length>=3&&(nm(i.name).includes(n)||n.includes(nm(i.name))))};
function toShop(r,all){window._sr=r;let a=0,s=0;(r.ingredients||[]).forEach(g=>{const it=all?null:matchIt(g),need=(+g.amount||0)-(it?it.q:0);if(it&&need<=0){s++;return}
 const am=Math.round(Math.max(need,0)),ex=S.shop.find(x=>!x.done&&nm(x.name)===nm(g.name)&&x.unit===g.unit);
 if(ex)ex.amount=(+ex.amount||0)+am;else S.shop.push({id:"s"+Date.now()+Math.random().toString(36).slice(2,6),name:g.name,amount:am,unit:g.unit||"",done:false,from:r.title});a++});
 save();const q2=$("q2"),qv=q2&&q2.value;render();if(qv!=null&&$("q2"))$("q2").value=qv;
 toast(a?`🛒 ${a} ingredient${a===1?"e aggiunto":"i aggiunti"} alla lista`+(s?`<br>${s} già in dispensa`:"")+`<br><a href="#" onclick="S.tab='lista';render();return false" style="color:inherit;font-weight:700">Vai alla lista →</a>`:`Hai già tutti gli ingredienti in dispensa.<br><a href="#" onclick="toShop(window._sr,true);return false" style="color:inherit;font-weight:700">Aggiungi comunque alla lista</a>`)}
const srcLinks=r=>{const q=encodeURIComponent("ricetta "+r.title),a=u=>`<a href="https://www.google.com/search?q=${q}${u}" target="_blank" rel="noopener noreferrer">`;return `<div class="mu" style="margin-top:8px">${r.origin?"🌍 Origine: "+esc(r.origin)+"<br>":""}📚 Fonte: elaborata dall’AI, non copiata da un sito. Confrontala con le fonti reali: ${a("")}Google ↗</a> · ${a("+site:giallozafferano.it")}GialloZafferano ↗</a> · ${a("+site:cucchiaio.it")}Cucchiaio d’Argento ↗</a></div>`};
const BASIC=/^(acqua|sale|pepe|ghiaccio)\b/i;
function avail(g){if(BASIC.test(g.name||""))return{st:"ok"};
 let it=matchIt(g);const amt=+g.amount||0;
 if(!it){const n=nm(g.name);if(n.length>=3)it=S.items.find(i=>nm(i.name).length>=3&&(nm(i.name).includes(n)||n.includes(nm(i.name))));return it?{st:"ok",it,note:true}:{st:"no"}}
 return amt>0&&it.u===g.unit&&it.q<amt?{st:"part",it}:{st:"ok",it}}
const inList=g=>S.shop.some(x=>!x.done&&nm(x.name)===nm(g.name));
const miss=r=>r.ingredients.filter(g=>avail(g).st!=="ok").length;
const avTxt=r=>{const m=miss(r);return m?`🛒 mancano ${m} ingredient${m===1?"e":"i"}`:"✅ hai tutto"};
const ingList=r=>r.ingredients.map(g=>avail(g).st==="ok"?esc(g.name):`<span style="color:var(--mu);opacity:.6">${esc(g.name)}</span>`).join(", ");
function shopOne(i){const r=S.cur,g=r.ingredients[i],a=avail(g),have=a.it&&a.it.u===g.unit?a.it.q:0,need=Math.round(Math.max((+g.amount||0)-have,0));
 const ex=S.shop.find(x=>!x.done&&nm(x.name)===nm(g.name)&&x.unit===g.unit);
 if(ex)ex.amount=(+ex.amount||0)+need;else S.shop.push({id:"s"+Date.now()+Math.random().toString(36).slice(2,6),name:g.name,amount:need,unit:g.unit||"",done:false,from:r.title});
 save();render();toast(`🛒 ${esc(g.name)} aggiunto alla lista<br><a href="#" onclick="S.tab='lista';render();return false" style="color:inherit;font-weight:700">Vai alla lista →</a>`)}
function vShop(){
 const dn=S.shop.filter(x=>x.done);
 let h=`<div class="card"><div class="row"><input id="sn" placeholder="Aggiungi alla lista (es. Latte)" onkeydown="if(event.key==='Enter')addShop()"><button class="btn" onclick="addShop()">＋</button></div><div class="mu" style="margin-top:8px">Spunta un prodotto quando lo compri: va subito in dispensa, con quantità e scadenza stimate che puoi correggere con ✏️.</div></div>`;
 if(!S.shop.length)return h+`<p class="mu">La lista è vuota. Dalle ricette (cercate, manuali o dell’AI) puoi aggiungere gli ingredienti che ti mancano.</p>`;
 h+=S.shop.slice().sort((a,b)=>a.done-b.done).map(x=>`<div class="card row"><label style="display:flex;gap:10px;align-items:center;flex:1;cursor:pointer"><input type="checkbox" style="width:22px;height:22px;flex:none" ${x.done?"checked":""} onchange="tick('${x.id}')"><span style="${x.done?"text-decoration:line-through;opacity:.55":""}">${emo(x.name)} <b>${esc(x.name)}</b>${x.amount?" · "+fmt(x.amount,x.unit):""}${x.from?`<div class="mu">per: ${esc(x.from)}</div>`:""}</span></label><button class="x" onclick="rmShop('${x.id}')" aria-label="Elimina">✕</button></div>`).join("");
 return h+(dn.length?`<button class="btn g" onclick="S.shop=S.shop.filter(x=>!x.done);save();render()">Rimuovi acquistati (${dn.length})</button>`:"")}
function addShop(){const n=$("sn").value.trim();if(!n)return;S.shop.push({id:"s"+Date.now(),name:n,amount:0,unit:"",done:false,from:""});save();render();$("sn").focus()}
const NOEXP=/zucchero|\bsale\b|miele|aceto/i,EXD=[[/pane|pizza/i,3],[/latte|panna/i,7],[/mozzarella|ricotta/i,5],[/yogurt/i,14],[/uova|uovo/i,21]],CD={"Cereali e derivati":180,"Latticini e uova":10,"Carne e pesce":4,"Frutta e verdura":6,"Legumi":365,"Condimenti e oli":240,"Dolci e snack":120,"Bevande":120,"Altro":30};
function tick(id){const x=S.shop.find(s=>s.id===id);if(!x)return;
 if(x.done){x.done=false;save();return render()}
 const u=x.unit||"pz",est=!(+x.amount>0),q=est?(u==="pz"?1:500):+x.amount,cat=guess(x.name),o=EXD.find(([re])=>re.test(x.name)),exp=NOEXP.test(x.name)?"":addDays(o?o[1]:CD[cat]||30);
 const ex=S.items.find(i=>i.u===u&&nm(i.name)===nm(x.name));let pid,merged=null;
 if(ex){merged={q:ex.q,exp:ex.exp};ex.q+=q;ex.exp=!ex.exp||!exp?"":(ex.exp>=today()&&ex.exp<exp?ex.exp:exp);pid=ex.id}
 else{pid="p"+Date.now()+Math.random().toString(36).slice(2,5);S.items.push({id:pid,name:x.name,cat,q,u,exp})}
 S.shop=S.shop.filter(s=>s.id!==id);S.undo={x:{...x},pid,merged};const L0=(LOCS.find(l=>l[0]===locOf(S.items.find(i=>i.id===pid)))||LOCS[0])[1];save();render();

function pick(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);const t=S.cur.title,old=S.ph[t];S.ph[t]=c.toDataURL("image/jpeg",.7);try{localStorage.setItem("ph",JSON.stringify(S.ph))}catch(e){if(old)S.ph[t]=old;else delete S.ph[t];toast("Spazio esaurito: rimuovi qualche foto.")}phPush(t);render()};im.onerror=()=>toast("Immagine non valida.");im.src=rd.result};rd.readAsDataURL(f)}
function rmPh(){const t=S.cur.title;delete S.ph[t];W("ph",S.ph);phDel(t);render()}
function go(d){S.done[S.step]=true;S.step+=d;render()}
function lib(){const r=S.cur;S.lib[r.title]=S.lib[r.title]||{};S.lib[r.title].r=r;return S.lib[r.title]}
function rate(k){lib().stars=k;save();render()}
function fav(){const l=lib();l.fav=!l.fav;save();render()}
function finish(){const r=S.cur,m=[];
 r.ingredients.forEach(g=>{const it=matchIt(g);if(!it)return;
  it.q=Math.round((it.q-Math.max(0,+g.amount||0))*100)/100;
  if(it.q<=0){S.items=S.items.filter(i=>i!==it);m.push(`${esc(it.name)} esaurito e rimosso`)}
  else if(FRESH.test(it.name)||it.cat==="Latticini e uova"&&/latte|panna|yogurt|ricotta|mozzarella/i.test(it.name)){const ne=addDays(3);if(it.exp>ne){it.exp=ne;m.push(`${esc(it.name)}: scadenza accorciata al ${ne.split("-").reverse().join("/")}`)}}});
 S.hist.unshift({at:Date.now(),r:JSON.parse(JSON.stringify(r)),stars:(S.lib[r.title]||{}).stars||0});save();S.recs=S.recs.filter(x=>x!==r);S.cur=null;S.tab="dispensa";render();
 toast("🎉 Ricetta completata!"+(m.length?"<br>"+m.join("<br>"):""))}
function vHist(){
 if(!S.hist.length)return `<p class="mu">Nessuna ricetta completata finora. Quando ne segnerai una come completata, comparirà qui.</p>`;
 return `<p class="mu">${S.hist.length} ricett${S.hist.length>1?"e completate":"a completata"}</p>`+S.hist.map((h,i)=>`<div class="card"><div class="row"><div style="display:flex;gap:10px;align-items:center">${th(h.r)}<div><b>${esc(h.r.title)}</b> ${srcB(h.r)}<div class="mu">${new Date(h.at).toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"})} · ${new Date(h.at).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})}</div></div></div><button class="x" onclick="delH(${i})" aria-label="Elimina dalla cronologia">✕</button></div><div class="row"><div>${[1,2,3,4,5].map(k=>`<button class="st ${(h.stars||0)>=k?"on":""}" style="font-size:24px" onclick="rateH(${i},${k})" aria-label="${k} stelle">★</button>`).join("")}</div><button class="btn g" onclick="redo(${i})">Rifai</button></div></div>`).join("")}
function rateH(i,k){const h=S.hist[i];h.stars=k;if(S.lib[h.r.title])S.lib[h.r.title].stars=k;save();render()}
function delH(i){S.hist.splice(i,1);save();render()}
function redo(i){openR(S.hist[i].r,"cron")}
function vPref(){const f=Object.values(S.lib).filter(l=>l.fav);
 if(!f.length)return `<p class="mu">Nessun preferito. Apri una ricetta e tocca “Aggiungi ai preferiti”.</p>`;
 return f.map(l=>`<div class="card row" style="cursor:pointer" onclick="S.sv=S.recs;S.recs=[S.lib['${esc(l.r.title).replace(/'/g,"\\'")}'].r];S.tab='ricette';open_(0);S.from='pref';S.recs=S.sv">${th(l.r)}<div style="flex:1"><b>${esc(l.r.title)}</b> ${srcB(l.r)}<div class="mu">${"★".repeat(l.stars||0)||"Non valutata"}</div></div><span>›</span></div>`).join("")}
let col=null,last={},tm,warned=0,pend=false,wr=false;const K=["items","lib","hist","mine","shop"];
const setSy=m=>{const e=$("sy");if(e)e.textContent=m==="on"?"☁️ sincronizzato":"📴 solo su questo dispositivo"};
const hid=t=>{let h=5381;for(const c of t)h=((h*33)^c.charCodeAt(0))>>>0;return "ph_"+h.toString(36)};
const cache=()=>{W("items",S.items);W("lib",S.lib);W("hist",S.hist);W("mine",S.mine);W("shop",S.shop);W("ph",S.ph)};
function err(){if(!warned++)toast("Sincronizzazione non riuscita: i dati restano su questo dispositivo.")}
function push(){pend=true;clearTimeout(tm);tm=setTimeout(flush,500)}
async function flush(){pend=false;if(!col)return;wr=true;try{for(const k of K){const v=S[k],s=JSON.stringify(v);if(s===last[k])continue;try{await col.doc(k).set({v});last[k]=s}catch(e){err()}}}finally{wr=false}}
async function phPush(t){if(!col||!S.ph[t])return;try{await col.doc(hid(t)).set({t,d:S.ph[t]})}catch(e){err()}}
async function phDel(t){if(!col)return;try{await col.doc(hid(t)).delete()}catch(e){err()}}
function ing(id,d){
 if(K.includes(id)){if(d.v===undefined||pend||wr)return 0;const s=JSON.stringify(d.v);if(s===last[id])return 0;S[id]=JSON.parse(s);last[id]=s;return 1}
 if(id.startsWith("ph_")&&d.t&&S.ph[d.t]!==d.d){S.ph[d.t]=d.d;return 1}
 return 0}
async function sync(){
 try{
  const db=await claude.use("db"),us=await claude.use("user"),uid=us?await us.id():null;
  if(!db||!uid)return setSy("local");
  col=db.collection("data/users/"+uid);
  const A={items:S.items,lib:S.lib,hist:S.hist,mine:S.mine,shop:S.shop,ph:S.ph},first=!L("synced");
  const snap=await col.get();let ch=0;
  snap.docs.forEach(d=>{if(d.exists)ch|=ing(d.id,d.data())});
  if(first){
   const ids=new Set(S.items.map(i=>i.id));A.items.forEach(i=>ids.has(i.id)||S.items.push(i));
   const ats=new Set(S.hist.map(h=>h.at));A.hist.forEach(h=>ats.has(h.at)||S.hist.push(h));S.hist.sort((a,b)=>b.at-a.at);
   S.lib={...A.lib,...S.lib};S.ph={...A.ph,...S.ph};
   const mi=new Set(S.mine.map(m=>m.id));A.mine.forEach(m=>mi.has(m.id)||S.mine.push(m));const si=new Set(S.shop.map(m=>m.id));A.shop.forEach(m=>si.has(m.id)||S.shop.push(m));
   W("synced",1);save();for(const t in S.ph)await phPush(t);ch=1}
  cache();setSy("on");if(ch&&S.tab!=="add"&&S.tab!=="nuova")render();
  col.onSnapshot(s=>{if(s.metadata.hasPendingWrites)return;let c=0;
   s.docChanges().forEach(x=>{const d=x.doc;if(x.type==="removed"){const t=d.data()&&d.data().t;if(t&&S.ph[t]){delete S.ph[t];c=1}}else c|=ing(d.id,d.data())});
   if(c){cache();if(S.tab!=="add"&&S.tab!=="nuova")render()}},()=>setSy("local"));
 }catch(e){setSy("local")}
}
render();sync();(ghOn()?ghInit():autoLoad());
</script><script>if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(function(){});</script>
