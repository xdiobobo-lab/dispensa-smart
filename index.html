/* Modalità file locale: l'AI usa la tua chiave API (GroqCloud o Anthropic), salvata solo in questo browser. */
if(typeof claude==="undefined"){(function(){
const KEY="akey",DEF={groq:"openai/gpt-oss-120b",ant:"claude-sonnet-5-5"};
const PREF=["openai/gpt-oss-120b","llama-3.3-70b-versatile","openai/gpt-oss-20b","llama-3.1-8b-instant"];
const NOCHAT=/whisper|guard|tts|orpheus|playai|embed|safeguard|compound/i;
const prov=k=>String(k).startsWith("sk-ant")?"ant":"groq";
const model=p=>localStorage.getItem("amodel_"+p)||DEF[p];
const SYS="Rispondi sempre e solo con JSON valido, senza testo prima o dopo e senza blocchi di codice.";
async function groqModels(key){
 try{const r=await fetch("https://api.groq.com/openai/v1/models",{headers:{authorization:"Bearer "+key}});const d=await r.json();
  return (d.data||[]).map(m=>m.id).filter(id=>id&&!NOCHAT.test(id))}catch(e){return[]}
}
async function pick(key){
 const ids=await groqModels(key);if(!ids.length)return null;
 return PREF.find(m=>ids.includes(m))||ids[0];
}
async function ask(prompt,retry){
 const key=localStorage.getItem(KEY);
 if(!key)throw new Error("Per usare l’AI serve la tua chiave API: tocca “🔑 Chiave AI” in alto.");
 const p=prov(key),m=model(p);let r;
 try{
  if(p==="ant")r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:m,max_tokens:8000,system:SYS,messages:[{role:"user",content:prompt}]})});
  else{
   const body={model:m,temperature:0.4,max_tokens:8000,messages:[{role:"system",content:SYS},{role:"user",content:prompt}]};
   if(/gpt-oss/i.test(m))body.reasoning_effort="low";
   r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+key},body:JSON.stringify(body)});
  }
 }catch(e){throw new Error("Connessione non riuscita: controlla internet.")}
 const d=await r.json().catch(()=>({}));
 if(!r.ok){
  const msg=(d.error&&d.error.message)||"";
  if(p==="groq"&&!retry&&(r.status===404||(/model/i.test(msg)&&/exist|access|decommission|not found|deprecat/i.test(msg)))){
   const nm=await pick(key);
   if(nm&&nm!==m){localStorage.setItem("amodel_groq",nm);return ask(prompt,1)}
  }
  if(r.status===401)throw new Error("Chiave API non valida: controllala con “🔑 Chiave AI”.");
  if(r.status===429)throw new Error("Limite di richieste raggiunto: attendi un minuto e riprova.");
  throw new Error(msg||"Errore AI ("+r.status+"). Prova a cambiare modello con ⚙️.");
 }
 let t=p==="ant"?(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join(""):(((d.choices||[])[0]||{}).message||{}).content||"";
 t=t.replace(/<think>[\s\S]*?<\/think>/g,"");
 const a=t.search(/[\[{]/),z=Math.max(t.lastIndexOf("]"),t.lastIndexOf("}"));
 try{return JSON.parse(t.slice(a,z+1))}catch(e){throw new Error("Risposta AI non leggibile, riprova.")}
}
async function vision(prompt,images){
 const key=localStorage.getItem(KEY);
 if(!key)throw new Error("Per usare l’AI serve la tua chiave API: tocca “🔑 Chiave AI” in alto.");
 const p=prov(key);let r;
 const m=localStorage.getItem("amodel_vision")||(p==="ant"?DEF.ant:"qwen/qwen3.8-27b");
 try{
  if(p==="ant"){
   const content=images.map(u=>({type:"image",source:{type:"base64",media_type:"image/jpeg",data:u.split(",")[1]}}));content.push({type:"text",text:prompt});
   r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:m,max_tokens:8000,system:SYS,messages:[{role:"user",content}]})});
  }else{
   const content=[{type:"text",text:prompt},...images.map(u=>({type:"image_url",image_url:{url:u}}))];
   r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+key},body:JSON.stringify({model:m,temperature:0.2,max_tokens:8000,messages:[{role:"system",content:SYS},{role:"user",content}]})});
  }
 }catch(e){throw new Error("Connessione non riuscita: controlla internet.")}
 const d=await r.json().catch(()=>({}));
 if(!r.ok){const msg=(d.error&&d.error.message)||"";
  if(r.status===401)throw new Error("Chiave API non valida: controllala con “🔑 Chiave AI”.");
  if(r.status===429)throw new Error("Limite di richieste raggiunto: attendi un minuto e riprova.");
  if(r.status===413||/too large|payload/i.test(msg))throw new Error("Le immagini sono troppo pesanti per il modello: riprova con meno pagine.");
  throw new Error(msg||"Errore AI nella lettura delle immagini ("+r.status+"). Il modello "+m+" potrebbe non supportare le immagini.")}
 let t=p==="ant"?(d.content||[]).filter(x=>x.type==="text").map(x=>x.text).join(""):(((d.choices||[])[0]||{}).message||{}).content||"";
 t=t.replace(/<think>[\s\S]*?<\/think>/g,"");
 const a=t.search(/[\[{]/),z=Math.max(t.lastIndexOf("]"),t.lastIndexOf("}"));
 try{return JSON.parse(t.slice(a,z+1))}catch(e){throw new Error("Risposta AI non leggibile, riprova.")}
}
window.claude={use:async n=>n==="sample"?{json:ask}:null,vision};
function upd(){const b=document.getElementById("kb");if(b){const k=localStorage.getItem(KEY);b.textContent=k?"🔑 Chiave AI ✓ ("+(prov(k)==="ant"?"Claude":"Groq")+")":"🔑 Chiave AI"}}
window.setKey=()=>{const k=prompt("Incolla la tua chiave API: GroqCloud (inizia con gsk_) oppure Anthropic (sk-ant-). Resta salvata solo in questo browser. Lascia vuoto per rimuoverla.",localStorage.getItem(KEY)||"");if(k===null)return;k.trim()?localStorage.setItem(KEY,k.trim()):localStorage.removeItem(KEY);upd()};
window.setModel=async()=>{
 const key=localStorage.getItem(KEY)||"",p=prov(key);let extra="";
 if(key&&p==="groq"){const ids=await groqModels(key);if(ids.length)extra="\n\nModelli disponibili con la tua chiave:\n"+ids.join("\n")}
 const m=prompt("Nome del modello da usare ("+(p==="ant"?"Claude":"GroqCloud")+"). Lascia vuoto per il predefinito ("+DEF[p]+")."+extra,model(p));
 if(m===null)return;m.trim()?localStorage.setItem("amodel_"+p,m.trim()):localStorage.removeItem("amodel_"+p)};
document.querySelector("h1").insertAdjacentHTML("afterend",'<div style="display:flex;gap:6px;flex-wrap:wrap"><button id="kb" class="btn g" style="padding:5px 12px;font-size:13px" onclick="setKey()"></button><button class="btn g" style="padding:5px 12px;font-size:13px" onclick="setModel()" aria-label="Cambia modello">⚙️ Modello</button></div>');upd();
})()}
</script>

${porUI()}<div class="card"><b>Ingredienti</b><ul style="margin:6px 0 0;padding-left:18px">${r.ingredients.map((g,gi)=>{const a=avail(g),ok=a.st==="ok";return `<li style="${ok?"":"color:var(--mu);opacity:.7"}">${emo(g.name)} ${esc(g.name)} — ${g.amount?g.amount+" "+esc(g.unit):"q.b."}${g.id||(r.src&&r.src!=="ai")?"":' <span class="mu">(base)</span>'}${ok?(a.it&&(a.note||a.via||nm(a.it.name)!==nm(g.name))?` <span class="mu">(${a.via?"alternativa: ":"in dispensa: "}${esc(a.it.name)}, ${fmt(a.it.q,a.it.u)})</span>`:""):(a.st==="part"?` (hai solo ${fmt(a.it.q,a.it.u)})`:" (non disponibile)"+(altOf(g).length?" — oppure: "+altOf(g).slice(0,3).map(esc).join(", "):""))+" "+(inList(g)?`<span class="bd ok">✅ in lista</span>`:`<button class="btn g" style="padding:2px 10px;font-size:12px" onclick="shopOne(${gi})">🛒 Aggiungi alla lista</button>`)}</li>`}).join("")}</ul><button class="btn g" style="margin-top:10px" onclick="toShop(cr())">🛒 Aggiungi alla lista della spesa</button> <button class="btn g" style="margin-top:10px" onclick="saveR(S.cur)">${inBook(r)?"✅ Nel ricettario":"💾 Salva nel ricettario"}</button>${inBook(r)?` <button class="btn g" style="margin-top:10px" onclick="editM(S.mine.findIndex(m=>m.title===S.cur.title))">✏️ Modifica ricetta</button>`:""}</div>
${r.notes?`<div class="card"><b>📝 Note</b><div style="white-space:pre-wrap">${esc(r.notes)}</div></div>`:""}<div class="dots">${r.steps.map((_,i)=>`<button class="${i===S.step?"on":S.done[i]?"d":""}" onclick="S.step=${i};render()" aria-label="Step ${i+1}">${i+1}</button>`).join("")}</div>
<div class="card"><div class="mu">STEP ${S.step+1} DI ${n}</div><p style="font-size:18px;margin:6px 0">${esc(r.steps[S.step])}</p></div>
<div class="row"><button class="btn g" ${S.step?"":"disabled"} onclick="go(-1)">← Indietro</button>
${last?`<button class="btn" onclick="${S.from==="piano"?"planFinish()":"finish()"}">✅ Segna ricetta completata</button>`:`<button class="btn" onclick="go(1)">Avanti →</button>`}</div>
<div class="card" style="margin-top:14px"><div class="row"><div>${[1,2,3,4,5].map(k=>`<button class="st ${(l.stars||0)>=k?"on":""}" onclick="rate(${k})" aria-label="${k} stelle">★</button>`).join("")}</div><button class="btn g" onclick="fav()">${l.fav?"♥ Nei preferiti":"♡ Aggiungi ai preferiti"}</button></div></div>`}
const th=r=>`<span class="th">${S.ph[r.title]?`<img src="${esc(S.ph[r.title])}" alt="">`:esc(r.emoji||"🍽️")}</span>`;
function photoBlock(r){const p=S.ph[r.title];
 return p?`<div class="card" style="padding:0;overflow:hidden"><img src="${esc(p)}" alt="${esc(r.title)}" style="width:100%;max-height:300px;object-fit:cover;display:block"><div class="row" style="padding:8px 12px"><label class="btn g" style="cursor:pointer">Cambia foto<input type="file" accept="image/*" hidden onchange="pick(this)"></label><button class="btn g" onclick="rmPh()">Rimuovi</button></div></div>`
 :`<label class="card" style="display:block;text-align:center;cursor:pointer;border-style:dashed"><div style="font-size:44px">${esc(r.emoji||"🍽️")}</div><div class="mu">📷 Aggiungi la foto del tuo piatto</div><input type="file" accept="image/*" hidden onchange="pick(this)"></label>`}
function pick(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);const t=S.cur.title,old=S.ph[t];S.ph[t]=c.toDataURL("image/jpeg",.7);try{localStorage.setItem("ph",JSON.stringify(S.ph))}catch(e){if(old)S.ph[t]=old;else delete S.ph[t];toast("Spazio esaurito: rimuovi qualche foto.")}phPush(t);render()};im.onerror=()=>toast("Immagine non valida.");im.src=rd.result};rd.readAsDataURL(f)}
function rmPh(){const t=S.cur.title;delete S.ph[t];W("ph",S.ph);phDel(t);render()}
function go(d){S.done[S.step]=true;S.step+=d;render()}
function lib(){const r=S.cur;S.lib[r.title]=S.lib[r.title]||{};S.lib[r.title].r=r;return S.lib[r.title]}
function rate(k){lib().stars=k;save();render()}
function fav(){const l=lib();l.fav=!l.fav;save();render()}
function finish(){const r=cr(),m=[];
 r.ingredients.forEach(g=>{const it=matchIt(g);if(!it)return;
  it.q=Math.round((it.q-Math.max(0,+g.amount||0))*100)/100;
  if(it.q<=0){S.items=S.items.filter(i=>i!==it);m.push(`${esc(it.name)} esaurito e rimosso`)}
  else if(FRESH.test(it.name)||it.cat==="Latticini e uova"&&/latte|panna|yogurt|ricotta|mozzarella/i.test(it.name)){const ne=addDays(3);if(it.exp>ne){it.exp=ne;m.push(`${esc(it.name)}: scadenza accorciata al ${ne.split("-").reverse().join("/")}`)}}});
 S.hist.unshift({at:Date.now(),r:JSON.parse(JSON.stringify(r)),stars:(S.lib[r.title]||{}).stars||0});save();S.recs=S.recs.filter(x=>x.title!==r.title);W("recs",S.recs);S.cur=null;S.tab="dispensa";render();
 toast("🎉 Ricetta completata!"+(m.length?"<br>"+m.join("<br>"):""))}
function vHist(){
 if(!S.hist.length)return `<p class="mu">Nessuna ricetta completata finora. Quando ne segnerai una come completata, comparirà qui.</p>`;
 return `<p class="mu">${S.hist.length} ricett${S.hist.length>1?"e completate":"a completata"}</p>`+S.hist.map((h,i)=>`<div class="card"><div class="row"><div style="display:flex;gap:10px;align-items:center">${th(h.r)}<div><b>${esc(h.r.title)}</b> ${srcB(h.r)}<div class="mu">${new Date(h.at).toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"})} · ${new Date(h.at).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})}</div></div></div><button class="x" onclick="delH(${i})" aria-label="Elimina dalla cronologia">✕</button></div><div class="row"><div>${[1,2,3,4,5].map(k=>`<button class="st ${(h.stars||0)>=k?"on":""}" style="font-size:24px" onclick="rateH(${i},${k})" aria-label="${k} stelle">★</button>`).join("")}</div><button class="btn g" onclick="redo(${i})">Rifai</button></div></div>`).join("")}
function rateH(i,k){const h=S.hist[i];h.stars=k;if(S.lib[h.r.title])S.lib[h.r.title].stars=k;save();render()}
function delH(i){S.hist.splice(i,1);save();render()}
function redo(i){openR(S.hist[i].r,"cron")}
function vPref(){const f=Object.values(S.lib).filter(l=>l.fav);
 if(!f.length)return `<p class="mu">Nessun preferito. Apri una ricetta e tocca “Aggiungi ai preferiti”.</p>`;
 return f.map(l=>`<div class="card row" style="cursor:pointer" onclick="S.sv=S.recs;S.recs=[S.lib['${esc(l.r.title).replace(/'/g,"\\'")}'].r];S.tab='ricette';open_(0);S.from='pref';S.recs=S.sv">${th(l.r)}<div style="flex:1"><b>${esc(l.r.title)}</b> ${srcB(l.r)}<div class="mu">${"★".repeat(l.stars||0)||"Non valutata"}</div></div><span>›</span></div>`).join("")}
let col=null,last={},tm,warned=0,pend=false,wr=false;const K=["items","lib","hist","mine","shop","coll","fly"];
const setSy=m=>{const e=$("sy");if(e)e.textContent=m==="on"?"☁️ sincronizzato":"📴 solo su questo dispositivo"};
const hid=t=>{let h=5381;for(const c of t)h=((h*33)^c.charCodeAt(0))>>>0;return "ph_"+h.toString(36)};
const cache=()=>{W("items",S.items);W("lib",S.lib);W("hist",S.hist);W("mine",S.mine);W("shop",S.shop);W("ph",S.ph);W("coll",S.coll);W("fly",S.fly)};
function err(){if(!warned++)toast("Sincronizzazione non riuscita: i dati restano su questo dispositivo.")}
function push(){pend=true;clearTimeout(tm);tm=setTimeout(flush,500)}
async function flush(){pend=false;if(!col)return;wr=true;try{for(const k of K){const v=S[k],s=JSON.stringify(v);if(s===last[k])continue;try{await col.doc(k).set({v});last[k]=s}catch(e){err()}}}finally{wr=false}}
async function phPush(t){if(!col||!S.ph[t])return;try{await col.doc(hid(t)).set({t,d:S.ph[t]})}catch(e){err()}}
async function phDel(t){if(!col)return;try{await col.doc(hid(t)).delete()}catch(e){err()}}
function ing(id,d){
 if(K.includes(id)){if(d.v===undefined||pend||wr)return 0;const s=JSON.stringify(d.v);if(s===last[id])return 0;S[id]=JSON.parse(s);last[id]=s;return 1}
 if(id.startsWith("ph_")&&d.t&&S.ph[d.t]!==d.d){S.ph[d.t]=d.d;return 1}
 return 0}
async function sync(){
 try{
  const db=await claude.use("db"),us=await claude.use("user"),uid=us?await us.id():null;
  if(!db||!uid)return setSy("local");
  col=db.collection("data/users/"+uid);
  const A={items:S.items,lib:S.lib,hist:S.hist,mine:S.mine,shop:S.shop,ph:S.ph},first=!L("synced");
  const snap=await col.get();let ch=0;
  snap.docs.forEach(d=>{if(d.exists)ch|=ing(d.id,d.data())});
  if(first){
   const ids=new Set(S.items.map(i=>i.id));A.items.forEach(i=>ids.has(i.id)||S.items.push(i));
   const ats=new Set(S.hist.map(h=>h.at));A.hist.forEach(h=>ats.has(h.at)||S.hist.push(h));S.hist.sort((a,b)=>b.at-a.at);
   S.lib={...A.lib,...S.lib};S.ph={...A.ph,...S.ph};
   const mi=new Set(S.mine.map(m=>m.id));A.mine.forEach(m=>mi.has(m.id)||S.mine.push(m));const si=new Set(S.shop.map(m=>m.id));A.shop.forEach(m=>si.has(m.id)||S.shop.push(m));
   W("synced",1);save();for(const t in S.ph)await phPush(t);ch=1}
  cache();setSy("on");if(ch&&S.tab!=="add"&&S.tab!=="nuova")render();
  col.onSnapshot(s=>{if(s.metadata.hasPendingWrites)return;let c=0;
   s.docChanges().forEach(x=>{const d=x.doc;if(x.type==="removed"){const t=d.data()&&d.data().t;if(t&&S.ph[t]){delete S.ph[t];c=1}}else c|=ing(d.id,d.data())});
   if(c){cache();if(S.tab!=="add"&&S.tab!=="nuova")render()}},()=>setSy("local"));
 }catch(e){setSy("local")}
}
render();sync();(ghOn()?ghInit():autoLoad());
